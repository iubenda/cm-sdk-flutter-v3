name: cmp_sdk_v3
description: "The CMP Plugin allows you to integrate Consent Management functionality."
version: 0.2.0
homepage: "https://consentmanager.net"

environment:
  sdk: '>=3.2.6 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: net.consentmanager.cmp_sdk_v3
        pluginClass: CmpSdkPlugin
      ios:
        pluginClass: CmpSdkPlugin
